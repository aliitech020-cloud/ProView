name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build executable
        run: pyinstaller --noconfirm ProView.spec

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/ProView -DestinationPath ProView-portable.zip

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = (python -c "import proview; print(proview.__version__)")
          & $iscc "/DAppVersion=$ver" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ProView-Setup
          path: installer_out/*.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: ProView-portable
          path: ProView-portable.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_out/*.exe
            ProView-portable.zip
