name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build executable
        run: pyinstaller --noconfirm ProView.spec

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/ProView -DestinationPath ProView-portable.zip

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = (python -c "import proview; print(proview.__version__)")
          & $iscc "/DAppVersion=$ver" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ProView-Setup
          path: installer_out/*.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: ProView-portable
          path: ProView-portable.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_out/*.exe
            ProView-portable.zip

      # ---- run the real exe on Windows (software OpenGL via Mesa, the runner has no GPU)
      - name: Get Mesa software OpenGL
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view -R pal1000/mesa-dist-win --json tagName,assets --jq '.tagName, .assets[].name'
          gh release download -R pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc*.7z" -D mesa_dl
          Get-ChildItem mesa_dl/*.7z | ForEach-Object { 7z x $_.FullName "-omesa/$($_.BaseName)" -y | Out-Null }
          Get-ChildItem -Recurse mesa -Include opengl32.dll, libgallium_wgl.dll, osmesa.dll | Select-Object FullName

      - name: Smoke test exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke -Force | Out-Null
          Copy-Item -Recurse dist/ProView smoke/
          $gl = Get-ChildItem -Recurse mesa -Filter opengl32.dll | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if ($gl) {
            Write-Host "Using Mesa from $($gl.DirectoryName)"
            Copy-Item "$($gl.DirectoryName)\*.dll" smoke/ProView/
          } else { Write-Host "Mesa opengl32.dll not found" }
          $env:GALLIUM_DRIVER = "llvmpipe"
          $p = Start-Process -FilePath smoke/ProView/ProView.exe -ArgumentList "--selftest", "$pwd\smoke\selftest.png" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host "TIMEOUT" }
          Write-Host "exit code: $($p.ExitCode)"
          $log = "$env:LOCALAPPDATA\ProView\proview.log"
          if (Test-Path $log) { Get-Content $log; Copy-Item $log smoke/ }
          if (Test-Path "$log.vtk.txt") { Get-Content "$log.vtk.txt"; Copy-Item "$log.vtk.txt" smoke/ }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload smoke test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            smoke/*.png
            smoke/*.log
            smoke/*.txt
