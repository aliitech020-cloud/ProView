name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build executable
        run: pyinstaller --noconfirm ProView.spec

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/ProView -DestinationPath ProView-portable.zip

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = (python -c "import proview; print(proview.__version__)")
          & $iscc "/DAppVersion=$ver" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ProView-Setup
          path: installer_out/*.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: ProView-portable
          path: ProView-portable.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_out/*.exe
            ProView-portable.zip

      # ---- run the real exe on Windows (software OpenGL via Mesa, the runner has no GPU)
      - name: Get Mesa software OpenGL
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest mesa-dist-win release whose MSVC package still ships the OpenGL driver
          $tags = gh release list -R pal1000/mesa-dist-win -L 40 --json tagName --jq '.[].tagName'
          foreach ($t in $tags) {
            gh release download $t -R pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" -D "mesa_dl/$t"
            $f = Get-ChildItem "mesa_dl/$t/*.7z" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $f) { continue }
            7z x $f.FullName "-omesa/$t" -y | Out-Null
            $gl = Get-ChildItem -Recurse "mesa/$t" -Filter opengl32.dll | Where-Object { $_.FullName -match "x64" }
            if ($gl) { Write-Host "Using Mesa $t"; break }
            Write-Host "Mesa $t has no opengl32.dll, trying an older one"
            Remove-Item -Recurse -Force "mesa/$t", "mesa_dl/$t"
          }

      - name: Smoke test exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $gl = Get-ChildItem -Recurse mesa -Filter opengl32.dll | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          $env:GALLIUM_DRIVER = "llvmpipe"
          function Run-Exe($dir, $label, $vars) {
            if ($gl) { Copy-Item "$($gl.DirectoryName)\*.dll" $dir -Force }
            foreach ($k in $vars.Keys) { Set-Item "env:$k" $vars[$k] }
            $logf = "$env:LOCALAPPDATA\ProView\proview.log"
            if (Test-Path $logf) { Remove-Item $logf }
            $p = Start-Process -FilePath "$dir\ProView.exe" -ArgumentList "--selftest", "$pwd\smoke\$label.png" -PassThru
            if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Host "TIMEOUT" }
            foreach ($k in $vars.Keys) { Remove-Item "env:$k" }
            Write-Host "=============== $label -> exit code $($p.ExitCode)"
            if (Test-Path $logf) { Get-Content $logf | Select-Object -Last 25 | Out-Host; Copy-Item $logf "smoke\$label.log" }
            return $p.ExitCode
          }
          New-Item -ItemType Directory smoke -Force | Out-Null
          Copy-Item -Recurse dist/ProView smoke/app
          $main = Run-Exe "smoke\app" "default" @{}
          Run-Exe "smoke\app" "no_cube" @{ PROVIEW_NO_CUBE = "1" } | Out-Null
          Run-Exe "smoke\app" "panel_child" @{ PROVIEW_PANEL_CHILD = "1" } | Out-Null
          Run-Exe "smoke\app" "msaa" @{ PROVIEW_MSAA = "1" } | Out-Null
          Run-Exe "smoke\app" "no_init" @{ PROVIEW_NO_INIT = "1" } | Out-Null
          Run-Exe "smoke\app" "all_off" @{ PROVIEW_NO_CUBE = "1"; PROVIEW_PANEL_CHILD = "1"; PROVIEW_MSAA = "1"; PROVIEW_NO_INIT = "1" } | Out-Null
          # control: the build from run #2 that worked on the user's PC (just open it and close it)
          gh run download 41855330166 -R ${{ github.repository }} -n ProView-windows -D old_build
          if (Test-Path old_build) {
            Get-ChildItem -Recurse old_build -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath old_build/x -Force }
            $old = Get-ChildItem -Recurse old_build/x -Filter ProView.exe | Select-Object -First 1
            if ($gl) { Copy-Item "$($gl.DirectoryName)\*.dll" $old.DirectoryName -Force }
            $p = Start-Process -FilePath $old.FullName -PassThru
            Start-Sleep -Seconds 15
            Write-Host "=============== old build #2 alive after 15 s: $(-not $p.HasExited) (exit code $($p.ExitCode))"
            if (-not $p.HasExited) { $p.Kill() }
          }
          if ($main -ne 0) { exit 1 }

      - name: Upload smoke test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            smoke/*.png
            smoke/*.log
            smoke/*.txt
