name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build executable
        run: pyinstaller --noconfirm ProView.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/ProView -DestinationPath ProView-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProView-windows
          path: ProView-windows.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ProView-windows.zip
